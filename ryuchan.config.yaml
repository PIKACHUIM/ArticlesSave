# 网站的基本信息
site:
  tab: 皮卡的博客 # 浏览器标签栏上显示的文本
  title:  皮卡的博客 # 网站的标题
  description: "皮卡丘的文章的Markdown格式备份"
  language: zh  # 网站的语言，例如 "en" 是英文
  favicon: /favicon.ico # 网站的图标，用于浏览器标签栏和其他地方显示
  theme: # 更多主题 https://daisyui.com/docs/themes/
    light: winter # 主题的浅色模式
    dark: dracula # 主题的深色模式
    code: github-dark # 代码块的主题 https://shiki.style/themes
  date_format: ddd MMM DD YYYY # 日期格式设置，支持自定义格式
  blog: # 博客相关配置
    pageSize: 8 # 每页显示的文章数量
  banner:
    images:
      - "https://s2.loli.net/2025/01/25/PBvHFjr5yDu6t4a.webp"
      - "https://s2.loli.net/2025/01/25/6bKcwHZigzlM4mJ.webp"
      - "https://s2.loli.net/2025/01/25/H9WgEK6qNTcpFiS.webp"
      - "https://s2.loli.net/2025/01/25/njNVtuUMzxs81RI.webp"
      - "https://s2.loli.net/2025/01/25/tozsJ8QHAjFN3Mm.webp"
      - "https://s2.loli.net/2025/01/25/Pm89OveZq7NWUxF.webp"
      - "https://s2.loli.net/2025/01/25/UCYKvc1ZhgPHB9m.webp"
      - "https://s2.loli.net/2025/01/25/JjpLOW8VSmufzlA.webp"
    height: "60vh"
    # 动漫主题专属轮播图，切换到对应动漫主题时自动替换 Banner 图片
    anime_themes:
      march7:
        - "https://patchwiki.biligame.com/images/sr/e/e6/57h91ahf93rtqa7hn2x7d0rgehtcdg9.png"
        - "https://patchwiki.biligame.com/images/sr/3/31/9fa1lelfm2d1mn0g7i9gys0d2zmia44.png"
      gura:
        - "https://scrmbl.imgix.net/posts-images/2025/04/gawr-gura-a.jpg"
      umaru:
        - "https://haowallpaper.com/link/common/file/previewFileImg/15063312094498112"
      pikachu:
        - "https://i.imgur.com/6QX2a1c.jpg"
        - "https://i.pinimg.com/736x/b5/d3/94/b5d3942429c0ebde0f82f918c586a2d1.jpg"
  # Banner 页面标题配置
  pages:
    home:
      title: "皮卡的博客"
      subtitle: "迷子になった人は迷子になり、出会った人はまた出会う"
      typewriterTexts: # 新增打字机文本配置  
        - "🌳 迷子になった人は迷子になり、出会った人はまた出会う"
        - ""
        - ""
        - ""
    friend:
      title: "友人帐"
      subtitle: "记录那些珍贵的友谊，分享彼此的故事"
    about:
      title: "关于我"
      subtitle: "一个热爱生活与技术的普通人！"
    navigation:
      title: "网站导航"
      subtitle: "收藏的常用网站和工具链接"
    anime:
      title: "追番"
      subtitle: "记录和分享我喜欢的动漫作品"
    project:
      title: "Projects"
      subtitle: "展示一些个人搭建的项目，搬运工！"
  menu: # 菜单配置
    - id: home
      text: 文章
      href: /
      svg: "material-symbols:home-outline-rounded"
      target: _self
    - id: navigation
      text: 导航
      href: /navigation
      svg: "material-symbols:explore-outline"
      target: _self
      # 子菜单项配置
    - id: project
      text: 项目
      href: /project
      svg: "material-symbols:code-blocks-outline"
      target: _self
    - id: friend
      text: 友人帐
      href: /friends
      svg: "material-symbols:supervisor-account-outline-rounded"
      target: _self
    - id: about
      text: 关于皮
      href: /aboutme
      svg: "material-symbols:info-outline-rounded"
      target: _self

# 用户的个人信息
user:
  name: Pikachu # 用户名
  site: "https://coding.pika.net.cn/" # 用户的网站链接
  avatar: /profile.png # 用户头像路径
  sidebar: # 侧边栏配置
    social:
      - href: "https://github.com/PIKACHUIM"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/23090073"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "https://t.me/pikakapi"
        ariaLabel: Telegram
        title: Telegram
        svg: "ri:telegram-line"


  footer:
    social:
      - href: "https://github.com/PIKACHUIM"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/23090073"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "https://t.me/pikakapi"
        ariaLabel: Telegram
        title: Telegram
        svg: "ri:telegram-line"

# 评论系统配置
comments:
  enable: false # 是否启用评论
  type: giscus # giscus/waline/none
  giscus:
    repo: ""
    repoId: ""
    category: "General"
    categoryId: ""
    mapping: "pathname"
    lang: "zh-CN"
    inputPosition: "top"
    reactionsEnabled: "1"
    emitMetadata: "0"
    loading: "lazy"
  waline:
    serverURL: ""
    lang: "zh-CN"
    emoji:
      - "https://unpkg.com/@waline/emojis@1.1.0/weibo"
      - "https://unpkg.com/@waline/emojis@1.1.0/bilibili"
    meta: [ "nick", "mail", "link" ]
    requiredMeta: [ ]
    reaction: false
    pageview: false
# Umami 统计配置
umami:
  enable: false
  baseUrl: ""
  shareId: ""
  websiteId: ""
  timezone: "Asia/Shanghai"
